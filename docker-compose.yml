version: '3.8'

services:
  # MySQL 8.0 Database Container
  mysql:
    image: mysql:8.0
    container_name: digital-legacy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_legacy_manager}
      MYSQL_USER: ${MYSQL_USER:-dl_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dl_pass123!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass123!}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/digital_legacy_manager.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - digital-legacy-network

  # Spring Boot 3 Backend API Container
  backend:
    build:
      context: ./digital-legacy-backend
      dockerfile: Dockerfile
    container_name: digital-legacy-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-digital_legacy_manager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-dl_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-dl_pass123!}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      APP_JWT_EXPIRATION_MS: 86400000
      APP_SECURITY_AES_SECRET_KEY: ${APP_SECURITY_AES_SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      APP_STORAGE_UPLOAD_DIR: /app/uploads/documents
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - encrypted_vault_files:/app/uploads/documents
    networks:
      - digital-legacy-network

  # React + Vite Production Nginx Frontend Container
  frontend:
    build:
      context: ./digital-legacy-frontend
      dockerfile: Dockerfile
    container_name: digital-legacy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - digital-legacy-network

networks:
  digital-legacy-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  encrypted_vault_files:
    driver: local
